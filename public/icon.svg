<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#262D3D" stroke-width="4" />
  
  <!-- Subtle ambient inner ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E2533" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1A202C" stroke-width="1.5" />

  <!-- Trajectory Vector Arc -->
  <path d="M 140 372 C 160 220, 240 160, 360 144" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Critical Path Nodes -->
  <circle cx="140" cy="372" r="10" fill="#0B0D12" stroke="#60A5FA" stroke-width="5" />
  <circle cx="240" cy="224" r="12" fill="#0B0D12" stroke="#3B82F6" stroke-width="6" />
  <circle cx="360" cy="144" r="16" fill="#3B82F6" stroke="#93C5FD" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="360" cy="144" r="6" fill="#FFFFFF" />

  <!-- Target Reticle Sight Crosshairs -->
  <line x1="360" y1="104" x2="360" y2="124" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="360" y1="164" x2="360" y2="184" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="320" y1="144" x2="340" y2="144" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="380" y1="144" x2="400" y2="144" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>
